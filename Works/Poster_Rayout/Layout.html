<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポスターレイアウト・デザインシステム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fdfbf7; color: #3d3d3d; }
        .canvas-area {
            aspect-ratio: 1 / 1.414;
            background-color: white;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .guide-line { position: absolute; border: 1px dashed rgba(99, 102, 241, 0.3); pointer-events: none; }
        .weight-indicator {
            position: absolute;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #4f46e5;
        }
        .chart-container { position: relative; width: 100%; height: 250px; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-10">

<!-- Chosen Palette: Warm Sand & Indigo (Neutral Balance) -->
<!-- Application Structure Plan:
このSPAは、5つのレイアウトテンプレートを単なる「サンプル画像」ではなく、「構造的な数値データ（デザインシステム）」として提示します。
1. Dashboard: 左側のサイドバーでパターンを選択。
2. Visual Preview: 中央にポスターの「設計図（Blueprint）」を表示。ボタンで「完成イメージ」と「構造線」を切り替え可能。
3. Parameter Panel: 右側に、そのテンプレートを再現するための具体的数値（余白、フォント比率）と視覚的重み（Chart.js）を表示。
4. Implementation Guide: 下部に、そのレイアウトを採用する際のチェックリストを表示。
-->
<!-- Visualization & Content Choices:
- Blueprint Visualization -> HTML/CSS Layers -> SVGを使わず、 Tailwindの絶対配置で「視線誘導線」や「構成要素の境界」を表現。
- Visual Weight Analysis -> Radar Chart (Chart.js) -> 視認性、インパクト、情報密度、洗練度、誘導力の5軸で分析。
- Interaction -> JS State Management -> タブ切り替えにより、パターンの比較を容易に。
-->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

<div class="max-w-7xl mx-auto">
    <header class="mb-10 flex flex-col md:flex-row justify-between items-end border-b border-stone-200 pb-6">
        <div>
            <h1 class="text-3xl font-bold text-stone-800 tracking-tight">ポスターレイアウト・デザインシステム</h1>
            <p class="text-stone-500 mt-2">分析に基づいた5つの黄金パターンとその構造的数値定義</p>
        </div>
        <div class="flex gap-2 bg-stone-100 p-1 rounded-xl mt-4 md:mt-0">
            <button onclick="setViewMode('blueprint')" id="btn-blueprint" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white shadow-sm text-indigo-600">設計図 (Blueprint)</button>
            <button onclick="setViewMode('preview')" id="btn-preview" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-stone-500">プレビュー</button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Sidebar: Pattern Selection -->
        <div class="lg:col-span-3 space-y-3">
            <h2 class="text-xs font-bold text-stone-400 uppercase tracking-widest mb-4">レイアウト・パターン</h2>
            <div id="nav-list" class="flex flex-col gap-2">
                <!-- JS Populated -->
            </div>
        </div>

        <!-- Main View: Poster Construction -->
        <div class="lg:col-span-5 flex justify-center">
            <div id="canvas" class="canvas-area w-full max-w-md border border-stone-200 rounded-sm">
                <!-- Dynamic Content -->
            </div>
        </div>

        <!-- Sidebar: Parameters & Analysis -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
                <h3 class="text-sm font-bold text-stone-400 uppercase tracking-widest mb-4">視覚的バランス分析</h3>
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <div id="spec-panel" class="bg-indigo-900 text-indigo-100 p-6 rounded-2xl shadow-xl fade-in">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Implementation Checklist -->
    <section class="mt-12 bg-stone-800 text-stone-200 p-8 rounded-3xl shadow-lg">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
            <span class="w-2 h-6 bg-amber-400 rounded-full"></span>
            実装時のチェックリスト
        </h2>
        <div id="checklist" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content -->
        </div>
    </section>
</div>

<script>
const patterns = [
    {
        id: 'zf',
        name: 'Z型/F型 (王道)',
        desc: '視線の自然な流れ（左上→右下）に沿った情報配置。',
        stats: [90, 80, 70, 60, 95], // 視認, インパクト, 洗練, 密度, 誘導
        specs: {
            margin: '外周 10% (Gold Ratio)',
            typography: 'H1: 32pt / Body: 12pt / CTA: 18pt',
            visualWeight: '中央 50% / 下部 20%'
        },
        checklist: [
            '左上にロゴまたはイベント名を配置したか',
            '中央付近に象徴的なビジュアルがあるか',
            '右下（Zの終点）にQRコードやURLがあるか',
            '視線の「折り返し地点」にサブコピーがあるか'
        ],
        blueprint: `
            <div class="guide-line top-10 left-0 w-full"></div>
            <div class="guide-line bottom-20 left-0 w-full"></div>
            <div class="weight-indicator top-[10%] left-[10%] w-[30%] h-[10%]">LOGO/ID (Start)</div>
            <div class="weight-indicator top-[25%] left-[10%] w-[80%] h-[15%]">CATCH COPY</div>
            <div class="weight-indicator top-[45%] left-[15%] w-[70%] h-[30%]">MAIN VISUAL</div>
            <div class="weight-indicator bottom-[10%] right-[10%] w-[25%] h-[15%]">CTA (End)</div>
        `,
        preview: `
            <div class="p-10 h-full flex flex-col">
                <div class="text-xs font-bold text-indigo-600 mb-2">EVENT 2024</div>
                <h2 class="text-4xl font-bold text-stone-900 mb-6 leading-tight">価値ある体験を、<br>その手に。</h2>
                <div class="flex-grow bg-stone-100 rounded-lg flex items-center justify-center text-stone-400 italic">Visual Area</div>
                <div class="mt-8 flex justify-between items-end">
                    <div class="text-[10px] text-stone-400 leading-relaxed">2024.12.24<br>Tokyo International Hall</div>
                    <div class="w-16 h-16 bg-stone-800 rounded flex items-center justify-center text-white text-[8px]">QR CODE</div>
                </div>
            </div>
        `
    },
    {
        id: 'symmetry',
        name: 'センター・シンメトリー',
        desc: '中心軸を基準にした左右対称。権威と安定感。',
        stats: [85, 95, 80, 50, 70],
        specs: {
            margin: '左右均等 15%',
            typography: 'H1: 42pt / Sub: 14pt / Info: 10pt',
            visualWeight: '中央 70% (Main Focus)'
        },
        checklist: [
            '中心軸から左右の要素の「重み」が等しいか',
            'タイトルは中央揃えを徹底しているか',
            '背景の余白を多めに取り、孤立感を出せているか',
            '最重要要素が画面の幾何学的な中央にあるか'
        ],
        blueprint: `
            <div class="guide-line left-1/2 top-0 h-full"></div>
            <div class="weight-indicator top-[15%] left-1/2 -translate-x-1/2 w-[60%] h-[8%]">ID / TAG</div>
            <div class="weight-indicator top-[28%] left-1/2 -translate-x-1/2 w-[80%] h-[40%]">HERO VISUAL</div>
            <div class="weight-indicator top-[72%] left-1/2 -translate-x-1/2 w-[70%] h-[12%]">MAIN TITLE</div>
            <div class="weight-indicator bottom-[8%] left-1/2 -translate-x-1/2 w-[40%] h-[5%]">INFO</div>
        `,
        preview: `
            <div class="h-full flex flex-col items-center justify-center p-12 text-center">
                <div class="text-xs tracking-[0.5em] text-stone-400 mb-10">ANNIVERSARY</div>
                <div class="w-48 h-48 rounded-full border border-stone-200 mb-10 bg-stone-50 flex items-center justify-center italic text-stone-300">Portrait</div>
                <h2 class="text-5xl font-bold text-stone-900 mb-4 tracking-tighter">ELEGANCE</h2>
                <p class="text-sm text-stone-500 mb-12">洗練の極み、伝統の継承。</p>
                <div class="text-[10px] uppercase tracking-widest text-stone-400">Limited Collection</div>
            </div>
        `
    },
    {
        id: 'grid',
        name: 'グリッド・モジュラー',
        desc: '画面を格子状に分割。多情報の整理に最適。',
        stats: [75, 60, 70, 95, 80],
        specs: {
            margin: '均等 8px (Gutter)',
            typography: 'Base: 10pt / Heading: 18pt',
            visualWeight: '各モジュール 均等分割'
        },
        checklist: [
            '格子（グリッド）の間隔は一定に保たれているか',
            '各情報の境界線が揃っているか',
            '写真はグリッドの枠をはみ出していないか',
            '色の反転などを使ってモジュールの主従を出しているか'
        ],
        blueprint: `
            <div class="guide-line left-1/2 top-0 h-full"></div>
            <div class="guide-line left-0 top-1/3 w-full"></div>
            <div class="guide-line left-0 top-2/3 w-full"></div>
            <div class="weight-indicator top-[2%] left-[2%] w-[96%] h-[30%]">MAIN THEME</div>
            <div class="weight-indicator top-[35%] left-[2%] w-[46%] h-[30%]">SUB 1</div>
            <div class="weight-indicator top-[35%] right-[2%] w-[46%] h-[30%]">SUB 2</div>
            <div class="weight-indicator bottom-[2%] left-[2%] w-[46%] h-[30%]">SUB 3</div>
            <div class="weight-indicator bottom-[2%] right-[2%] w-[46%] h-[30%]">SUB 4</div>
        `,
        preview: `
            <div class="p-2 h-full flex flex-col gap-2">
                <div class="h-1/3 bg-stone-900 text-white p-6 rounded-lg">
                    <h2 class="text-2xl font-bold">PROJECT<br>CATALOG</h2>
                </div>
                <div class="flex-grow grid grid-cols-2 gap-2">
                    <div class="bg-stone-100 rounded-lg p-3 text-[10px] text-stone-400">Item 01</div>
                    <div class="bg-stone-100 rounded-lg p-3 text-[10px] text-stone-400">Item 02</div>
                    <div class="bg-stone-100 rounded-lg p-3 text-[10px] text-stone-400">Item 03</div>
                    <div class="bg-indigo-50 rounded-lg p-3 text-[10px] text-indigo-400 font-bold">NEW</div>
                </div>
            </div>
        `
    },
    {
        id: 'dynamic',
        name: 'ダイナミック・非対称',
        desc: '重心を崩すことで動きを出す。革新的な印象。',
        stats: [60, 95, 85, 40, 75],
        specs: {
            margin: '不規則 5%-20%',
            typography: 'H1: 64pt (Italic) / Info: 8pt',
            visualWeight: '対角線上のバランス'
        },
        checklist: [
            '斜めのライン（対角線）を意識した配置か',
            '極端に大きい要素と小さい要素の対比があるか',
            '重なり（オーバーラップ）を利用しているか',
            '全体のバランスが左右で「不等辺」になっているか'
        ],
        blueprint: `
            <div class="guide-line top-0 left-0 w-full h-full rotate-12 origin-center"></div>
            <div class="weight-indicator top-[10%] left-[5%] w-[80%] h-[20%] -rotate-6">DYNAMIC TITLE</div>
            <div class="weight-indicator top-[40%] right-[5%] w-[50%] h-[40%] rotate-3">OFF-CENTER IMG</div>
            <div class="weight-indicator bottom-[10%] left-[10%] w-[30%] h-[10%]">DETAILS</div>
        `,
        preview: `
            <div class="p-8 h-full bg-stone-900 overflow-hidden relative">
                <div class="absolute -top-10 -right-20 w-80 h-80 bg-indigo-600 rounded-full mix-blend-screen opacity-20"></div>
                <h2 class="text-7xl font-bold text-white italic leading-none mb-12 transform -rotate-2">SPEED<br>LIMIT</h2>
                <div class="w-full h-48 bg-indigo-500 transform rotate-3 -mr-20 translate-x-10 flex items-center justify-center text-white/50 italic">Motion Visual</div>
                <div class="mt-20 text-indigo-400 text-xs font-bold tracking-widest">TOKYO UNDERGROUND / 2024</div>
            </div>
        `
    },
    {
        id: 'typo',
        name: 'タイポグラフィ主導',
        desc: '文字をビジュアルとして扱う。メッセージ重視。',
        stats: [70, 75, 95, 30, 85],
        specs: {
            margin: '外周 5% / 行間 1.2',
            typography: 'H1: 80pt / Sub: 10pt',
            visualWeight: '文字の「粗密」による誘導'
        },
        checklist: [
            '文字が背景ではなく「主役」になっているか',
            'フォントのウェイト（太さ）に極端な差があるか',
            '余白（ネガティブスペース）を大胆に使えているか',
            '文字の塊を一つの「図形」として捉えられているか'
        ],
        blueprint: `
            <div class="weight-indicator top-[5%] left-[5%] w-[90%] h-[40%]">BIG TYPO</div>
            <div class="weight-indicator top-[50%] left-[5%] w-[40%] h-[2%]">DIVIDER LINE</div>
            <div class="weight-indicator top-[55%] left-[5%] w-[60%] h-[15%]">SUB TEXT BLOCK</div>
            <div class="weight-indicator bottom-[5%] left-[5%] w-[90%] h-[5%]">BASE INFO</div>
        `,
        preview: `
            <div class="p-10 h-full flex flex-col justify-between">
                <div>
                    <h2 class="text-[120px] font-bold leading-[0.8] tracking-tighter text-stone-900">THE<br>ART</h2>
                    <div class="w-12 h-1 bg-indigo-600 my-8"></div>
                    <p class="text-sm text-stone-500 max-w-[200px] leading-relaxed">
                        語るべきは、その本質のみ。無駄を削ぎ落とした先に現れる美学。
                    </p>
                </div>
                <div class="flex justify-between items-baseline border-t border-stone-200 pt-4">
                    <span class="text-xs font-bold">EXHIBITION 2024</span>
                    <span class="text-xs">DEC 12-25</span>
                </div>
            </div>
        `
    }
];

let activePatternId = patterns[0].id;
let viewMode = 'blueprint';
let radarChart = null;

function init() {
    renderNav();
    renderContent();
    initChart();
}

function renderNav() {
    const list = document.getElementById('nav-list');
    list.innerHTML = '';
    patterns.forEach(p => {
        const isActive = p.id === activePatternId;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all border ${isActive ? 'bg-stone-800 text-white border-stone-800 shadow-md' : 'bg-white text-stone-600 border-stone-200 hover:bg-stone-50'}`;
        btn.innerHTML = `<span class="text-xs opacity-60 block uppercase font-bold tracking-widest">${p.id}</span><span class="font-bold">${p.name}</span>`;
        btn.onclick = () => {
            activePatternId = p.id;
            renderNav();
            renderContent();
            updateChart();
        };
        list.appendChild(btn);
    });
}

function renderContent() {
    const pattern = patterns.find(p => p.id === activePatternId);
    const canvas = document.getElementById('canvas');
    const specPanel = document.getElementById('spec-panel');
    const checklist = document.getElementById('checklist');

    // Canvas Update
    canvas.innerHTML = viewMode === 'blueprint' ? pattern.blueprint : pattern.preview;
    canvas.className = `canvas-area w-full max-w-md border border-stone-200 rounded-sm fade-in ${viewMode === 'preview' ? 'shadow-2xl' : ''}`;

    // Spec Panel Update
    specPanel.innerHTML = `
        <div class="fade-in">
            <h3 class="text-2xl font-bold mb-2">${pattern.name}</h3>
            <p class="text-indigo-200 text-sm mb-6">${pattern.desc}</p>
            <div class="space-y-4 pt-4 border-t border-indigo-800">
                <div class="flex justify-between text-xs"><span class="opacity-60">マージン設定</span><span class="font-bold">${pattern.specs.margin}</span></div>
                <div class="flex justify-between text-xs"><span class="opacity-60">推奨フォント比</span><span class="font-bold">${pattern.specs.typography}</span></div>
                <div class="flex justify-between text-xs"><span class="opacity-60">視覚的重み分布</span><span class="font-bold">${pattern.specs.visualWeight}</span></div>
            </div>
        </div>
    `;

    // Checklist Update
    checklist.innerHTML = pattern.checklist.map(item => `
        <div class="flex items-start gap-3 bg-stone-700/50 p-4 rounded-xl">
            <input type="checkbox" class="mt-1 w-4 h-4 accent-amber-400">
            <span class="text-sm">${item}</span>
        </div>
    `).join('');
}

function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('btn-blueprint').className = `px-4 py-2 rounded-lg text-sm font-bold transition-all ${mode === 'blueprint' ? 'bg-white shadow-sm text-indigo-600' : 'text-stone-500'}`;
    document.getElementById('btn-preview').className = `px-4 py-2 rounded-lg text-sm font-bold transition-all ${mode === 'preview' ? 'bg-white shadow-sm text-indigo-600' : 'text-stone-500'}`;
    renderContent();
}

function initChart() {
    const ctx = document.getElementById('radarChart').getContext('2d');
    const data = patterns.find(p => p.id === activePatternId).stats;
    
    radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['視認性', 'インパクト', '洗練度', '情報密度', '誘導力'],
            datasets: [{
                label: '性能スコア',
                data: data,
                backgroundColor: 'rgba(99, 102, 241, 0.2)',
                borderColor: '#6366f1',
                pointBackgroundColor: '#6366f1',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: { display: false, stepSize: 20 },
                    grid: { color: 'rgba(0,0,0,0.05)' }
                }
            },
            plugins: { legend: { display: false } }
        }
    });
}

function updateChart() {
    if (!radarChart) return;
    radarChart.data.datasets[0].data = patterns.find(p => p.id === activePatternId).stats;
    radarChart.update();
}

window.onload = init;
</script>
</body>
</html>
