<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="700" height="360" fill="#0d1520" rx="14"/>
  <text x="350" y="42" font-family="Arial" font-size="19" font-weight="bold" fill="#eee" text-anchor="middle">習慣はドミノ倒し — きっかけが連鎖を生む</text>
  <!-- domino pieces -->
  
    <rect x="60" y="190" width="55" height="80" rx="6" fill="#F18F01" opacity="0.85"/>
