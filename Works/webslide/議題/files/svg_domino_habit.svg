    <text x="297" y="315" font-family="Arial" font-size="10" fill="#556" text-anchor="middle">行動</text>
    <path d="M330,170 Q355,140 380,130" fill="none" stroke="#8E24AA" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  
    <rect x="390" y="130" width="55" height="140" rx="6" fill="#1565C0" opacity="0.85"/>
    <text x="417" y="162" font-size="20" text-anchor="middle">😴</text>
    <text x="417" y="295" font-family="Arial" font-size="12" font-weight="bold" fill="#ccc" text-anchor="middle">就寝</text>
    <text x="417" y="315" font-family="Arial" font-size="10" fill="#556" text-anchor="middle">目標</text>
    <path d="M450,150 Q475,120 500,110" fill="none" stroke="#1565C0" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  
    <rect x="520" y="110" width="55" height="160" rx="6" fill="#2E7D32" opacity="0.85"/>
    <text x="547" y="142" font-size="20" text-anchor="middle">☀️</text>
    <text x="547" y="295" font-family="Arial" font-size="12" font-weight="bold" fill="#ccc" text-anchor="middle">早起き</text>
    <text x="547" y="315" font-family="Arial" font-size="10" fill="#556" text-anchor="middle">結果</text>
    
  
  <!-- ground -->
  <line x1="40" y1="270" x2="660" y2="270" stroke="#223" stroke-width="2"/>
  <!-- label -->
  <text x="350" y="345" font-family="Arial" font-size="13" fill="#445" text-anchor="middle">気合ではなく、きっかけの設計で行動が自動的に連鎖する</text>
