    <text x="187" y="315" font-family="Arial" font-size="10" fill="#556" text-anchor="middle">阻害除去</text>
    <path d="M220,190 Q245,160 270,150" fill="none" stroke="#E53935" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  
    <rect x="270" y="150" width="55" height="120" rx="6" fill="#8E24AA" opacity="0.85"/>
    <text x="297" y="182" font-size="20" text-anchor="middle">🛏️</text>
