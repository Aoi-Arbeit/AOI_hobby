    <text x="87" y="315" font-family="Arial" font-size="10" fill="#556" text-anchor="middle">きっかけ</text>
    <path d="M120,210 Q145,180 170,170" fill="none" stroke="#F18F01" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  
    <rect x="160" y="170" width="55" height="100" rx="6" fill="#E53935" opacity="0.85"/>
