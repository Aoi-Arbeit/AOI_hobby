<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スライド1：導入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 16:9 Aspect Ratio Container */
        .slide-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #E65100 0%, #FF8F00 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Decorative Background Patterns */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            pointer-events: none;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: white;
            filter: blur(80px);
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-bounce:hover {
            transform: translateY(-10px);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Background Decorations -->
        <div class="bg-pattern">
            <div class="bg-circle" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
            <div class="bg-circle" style="width: 300px; height: 300px; bottom: -50px; right: -50px; background: #FFD54F;"></div>
        </div>

        <!-- Main Content -->
        <div class="relative z-10 text-center px-10">
            <!-- Title Section -->
            <div class="fade-in-up" style="animation-delay: 0.1s;">
                <h1 class="text-[5rem] md:text-[7rem] font-black leading-tight tracking-tighter drop-shadow-2xl">
                    頑張りすぎを<br>
                    <span style="color: #FFE082;">やめよう</span>
                </h1>
            </div>

            <!-- Subtext Section -->
            <div class="mt-8 space-y-2 fade-in-up" style="animation-delay: 0.3s;">
                <p class="text-2xl md:text-3xl font-bold opacity-90 tracking-wider">
                    肉体・精神・社会の3健康で
                </p>
                <p class="text-2xl md:text-3xl font-bold opacity-90 tracking-wider">
                    無理なく全力へ
                </p>
            </div>

            <!-- Icons Section -->
            <div class="mt-16 flex justify-center gap-16 md:gap-24 fade-in-up" style="animation-delay: 0.5s;">
                <!-- Body Icon -->
                <div class="flex flex-col items-center gap-4 icon-bounce">
                    <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-white/40 shadow-xl">
                        <svg viewBox="0 0 24 24" class="w-12 h-12 md:w-16 md:h-16 fill-none stroke-current stroke-[2]" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L7 17l-5-5"></path>
                            <circle cx="12" cy="5" r="3"></circle>
                            <path d="M6.5 9h11l-2 12h-7l-2-12z"></path>
                        </svg>
                    </div>
                    <span class="text-lg font-black tracking-widest bg-white/10 px-4 py-1 rounded-full">肉体</span>
                </div>

                <!-- Mind Icon -->
                <div class="flex flex-col items-center gap-4 icon-bounce">
                    <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-white/40 shadow-xl">
                        <svg viewBox="0 0 24 24" class="w-12 h-12 md:w-16 md:h-16 fill-none stroke-current stroke-[2]" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.74-3.43 2.5 2.5 0 0 1-2.3-3.63 2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 2.3-3.63 2.5 2.5 0 0 1 2.74-3.43A2.5 2.5 0 0 1 9.5 2Z"></path>
                            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.74-3.43 2.5 2.5 0 0 0 2.3-3.63 2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 0-2.3-3.63 2.5 2.5 0 0 0-2.74-3.43A2.5 2.5 0 0 0 14.5 2Z"></path>
                        </svg>
                    </div>
                    <span class="text-lg font-black tracking-widest bg-white/10 px-4 py-1 rounded-full">精神</span>
                </div>

                <!-- Social Icon -->
                <div class="flex flex-col items-center gap-4 icon-bounce">
                    <div class="w-24 h-24 md:w-32 md:h-32 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-2 border-white/40 shadow-xl">
                        <svg viewBox="0 0 24 24" class="w-12 h-12 md:w-16 md:h-16 fill-none stroke-current stroke-[2]" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <span class="text-lg font-black tracking-widest bg-white/10 px-4 py-1 rounded-full">社会</span>
                </div>
            </div>
        </div>

        <!-- Slide Footer -->
        <div class="absolute bottom-8 left-10 flex items-center gap-3 opacity-60">
            <div class="w-12 h-[3px] bg-white rounded-full"></div>
            <span class="text-sm font-bold tracking-[0.3em] uppercase">Section 01: Introduction</span>
        </div>
    </div>

</body>
</html>
