<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スライド2 - 健康 ＝ 3つの輪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
        }
        /* ベン図の重なりを表現するためのミックスモード */
        .venn-circle {
            mix-blend-mode: multiply;
            transition: all 0.5s ease;
        }
        .center-gold {
            background: radial-gradient(circle, #FFD700 0%, #FFB300 100%);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-row items-center p-16">

    <!-- 左カラム：テキスト -->
    <div class="w-2/5 flex flex-col justify-center space-y-8">
        <div>
            <h2 class="text-4xl font-bold text-gray-400 mb-2">健康 ＝</h2>
            <h1 class="text-7xl font-black text-gray-800 tracking-tight">
                3つの輪
            </h1>
        </div>
        
        <div class="space-y-4">
            <p class="text-3xl font-bold text-gray-700 leading-tight">
                肉体的・精神的・社会的
            </p>
            <p class="text-xl text-gray-500 font-medium">
                すべてが満たされた状態（WHO定義）
            </p>
        </div>
    </div>

    <!-- 右カラム：図解（ベン図） -->
    <div class="w-3/5 h-full flex items-center justify-center relative">
        <div class="relative w-[500px] h-[500px]">
            
            <!-- 肉体 (Green) -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full bg-green-400/80 venn-circle flex items-start justify-center pt-10">
                <span class="text-white font-black text-2xl drop-shadow-sm">肉体</span>
            </div>

            <!-- 精神 (Purple) -->
            <div class="absolute bottom-16 left-8 w-64 h-64 rounded-full bg-purple-400/80 venn-circle flex items-end justify-center pb-12">
                <span class="text-white font-black text-2xl drop-shadow-sm">精神</span>
            </div>

            <!-- 社会 (Terracotta) -->
            <div class="absolute bottom-16 right-8 w-64 h-64 rounded-full bg-[#BF360C]/70 venn-circle flex items-end justify-center pb-12">
                <span class="text-white font-black text-2xl drop-shadow-sm">社会</span>
            </div>

            <!-- 中心点 (Gold) -->
            <div class="absolute top-[52%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 rounded-full center-gold flex items-center justify-center z-10 border-4 border-white">
                <span class="text-[#5D4037] font-black text-xl">健康</span>
            </div>

        </div>
    </div>

    <!-- M1 バッジ（右上） -->
    <div class="absolute top-8 right-8 flex items-center bg-[#FF8F00] px-4 py-2 rounded-full border shadow-sm">
        <span class="text-white text-sm font-bold tracking-widest">🟠 M1 きっかけ</span>
    </div>

</body>
</html>
