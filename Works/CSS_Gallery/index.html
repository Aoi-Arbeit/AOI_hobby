<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSS Visual Gallery</title>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; padding: 50px; }
        .gallery-title { text-align: center; margin-bottom: 40px; }

        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* カードの枠組み */
        .thumb {
            position: relative;
            width: 250px;
            height: 250px;
            background: #e0e0e0; /* 背景がコードではなくグレーに */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb:hover { transform: translateY(-5px); }

        /* --- ここが「View（プレビュー）」部分 --- */
        .view-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        /* 個別のスタイル（本来はエディタから保存されたもの） */
        .glass-view {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 100px; height: 100px;
        }

        .neon-view {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 7px #fff, 0 0 21px #f0f;
            font-size: 24px;
        }

        /* ギャラリー全体の背景が暗い場合用 */
        .dark-bg { background: #2d2d2d; } 

        /* ホバー時のオーバーレイ（説明を表示） */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .thumb:hover .overlay { opacity: 1; }
        .overlay h3 { margin: 0; font-size: 18px; color: #00d4ff; }
    </style>
</head>
<body>

    <h1 class="gallery-title">CSS Visual Gallery</h1>

    <div class="gallery-container">
        
        <div class="thumb dark-bg" onclick="editCode('glassmorphism')">
            <div class="view-container">
                <div class="glass-view"></div>
            </div>
            <div class="overlay">
                <h3>Glassmorphism</h3>
                <p>クリックして編集</p>
            </div>
        </div>

        <div class="thumb dark-bg" onclick="editCode('neon-glow')">
            <div class="view-container">
                <div class="neon-view">NEON</div>
            </div>
            <div class="overlay">
                <h3>Neon Glow</h3>
                <p>クリックして編集</p>
            </div>
        </div>

    </div>

    <script>
        function editCode(id) {
            window.location.href = `editor.html?id=${id}`;
        }
    </script>
</body>
</html>
