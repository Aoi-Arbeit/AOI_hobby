<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSS Live Editor</title>
    <style>
        /* レイアウト設定 */
        body { font-family: sans-serif; margin: 0; background: #1e1e1e; color: #fff; overflow: hidden; }
        
        .header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: #252526; border-bottom: 1px solid #333; }
        
        .main-container { display: flex; height: calc(100vh - 60px); }

        /* エディタ（左側） */
        .editor-section { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #444; }
        textarea {
            flex: 1; background: #2d2d2d; color: #9cdcfe;
            font-family: 'Consolas', monospace; font-size: 16px;
            padding: 20px; border: none; outline: none; resize: none;
        }

        /* プレビュー（右側） */
        .preview-section { flex: 1; background: #333; display: flex; align-items: center; justify-content: center; position: relative; }
        .preview-label { position: absolute; top: 10px; left: 10px; font-size: 12px; color: #888; text-transform: uppercase; }

        /* プレビューのターゲット要素 */
        .preview-target {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: bold;
            border: 1px dashed #555; /* 初期状態で見やすくするため */
        }

        .btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; }
    </style>
    <style id="live-preview-style"></style>
</head>
<body>

    <div class="header">
        <h1 id="title" style="font-size: 18px;">Editor</h1>
        <a href="index.html" class="btn">ギャラリーに戻る</a>
    </div>

    <div class="main-container">
        <div class="editor-section">
            <textarea id="editor" spellcheck="false"></textarea>
        </div>

        <div class="preview-section">
            <span class="preview-label">Live Preview</span>
            <div class="preview-target">
                PREVIEW<br>ELEMENT
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const styleTag = document.getElementById('live-preview-style');
        const titleDisplay = document.getElementById('title');

        // サンプルの初期データ
        const snippets = {
            'glassmorphism': '/* .preview-target に対してスタイルを書いてください */\n.preview-target {\n  background: rgba(255, 255, 255, 0.1);\n  backdrop-filter: blur(10px);\n  -webkit-backdrop-filter: blur(10px);\n  border: 1px solid rgba(255, 255, 255, 0.2);\n  border-radius: 20px;\n  box-shadow: 0 8px 32px rgba(0,0,0,0.37);\n}',
            'neon-glow': '.preview-target {\n  background: #111;\n  color: #fff;\n  border: 4px solid #fff;\n  border-radius: 10px;\n  text-shadow: 0 0 7px #fff, 0 0 21px #f0f;\n  box-shadow: 0 0 5px #fff, inset 0 0 5px #fff, 0 0 20px #f0f, inset 0 0 20px #f0f;\n}'
        };

        // URLからIDを取得して初期表示
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id && snippets[id]) {
            titleDisplay.innerText = `Editing: ${id}`;
            editor.value = snippets[id];
        } else {
            editor.value = "/* .preview-target { ... } */";
        }

        // リアルタイム反映の処理
        function updatePreview() {
            styleTag.textContent = editor.value;
        }

        editor.addEventListener('input', updatePreview);
        window.addEventListener('load', updatePreview);
    </script>
</body>
</html>
