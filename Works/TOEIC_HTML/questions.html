<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TOEIC対策 - 問題</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="questions.css">
</head>

<body>

    <main id="main-content">

        <header id="quiz-header">
            <div class="progress-info">
                Question: <span id="current-num">1</span> / <span id="total-num">2</span>
            </div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </header>

        <section id="question-container">
            <h2 id="question-text">読み込み中...</h2>

            <nav id="options-nav">
                <ul id="options-list">
                </ul>
            </nav>

            <button id="skip-btn">結果を表示</button>
        </section>

        <section id="feedback-area" style="display: none;">
            <div id="result-label"></div>

            <article class="explanation-box">
                <p class="answer-row">
                    <strong>正解:</strong> <span id="answer-text"></span>
                </p>
                <div class="explanation-content">
                    <p><strong>解説:</strong></p>
                    <p id="explanation-text"></p>
                </div>
            </article>

            <nav id="quiz-navigation">
                <button id="result-btn" style="display: none;">結果を表示</button>
                <button id="next-btn" style="display: none;">次の問題へ</button>
            </nav>
        </section>
    </main>

    <script type="module" src="questions.js"></script>
</body>

</html>
