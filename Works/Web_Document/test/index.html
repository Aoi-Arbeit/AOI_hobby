<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocEditor — 書類作成Webページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/toolbar.css">
<link rel="stylesheet" href="css/a4-canvas.css">
<!-- jsPDF (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .hidden { display: none !important; }

  /* ── ホーム画面 ── */
  #homeScreen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--color-bg); padding: 40px 20px;
  }
  .home-logo {
    font-size: 28px; font-weight: 700; color: var(--color-primary);
    margin-bottom: 6px; letter-spacing: 0.02em;
  }
  .home-sub { font-size: 13px; color: var(--color-muted); margin-bottom: 40px; }
  .template-grid {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    max-width: 640px;
  }
  .template-card {
    width: 180px; background: var(--color-surface);
    border-radius: 10px; box-shadow: 0 3px 16px rgba(0,0,0,0.1);
    overflow: hidden; cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .template-card:hover {
    border-color: var(--color-accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(46,125,204,0.18);
  }
  .template-thumb {
    width: 100%; aspect-ratio: 210/297;
    display: flex; flex-direction: column;
    padding: 12px 10px 8px; gap: 4px; overflow: hidden;
  }
  .template-thumb .t-line { height: 3px; border-radius: 1px; }
  .template-thumb .t-thin { height: 2px; background: #dde4ed; border-radius: 1px; }
  .template-thumb .t-block { height: 20px; border-radius: 2px; margin-bottom: 2px; }
  .template-info { padding: 10px 12px 14px; }
  .template-name { font-size: 13px; font-weight: 700; color: var(--color-primary); margin-bottom: 3px; }
  .template-desc { font-size: 10px; color: var(--color-muted); line-height: 1.5; }

  /* ── エディタ画面 ── */
  #editorScreen { width: 100%; height: 100vh; }

  /* ツールバーグループ区切り */
  .tb-group { display: flex; align-items: center; gap: 3px; }
</style>
</head>
<body>

<!-- ══════════════════════════════════
     ホーム画面
═══════════════════════════════════ -->
<div id="homeScreen">
  <div class="home-logo">📄 DocEditor</div>
  <div class="home-sub">報告書・企画書をブラウザで作成、A4 PDFで出力</div>
  <div class="template-grid">

    <!-- 報告書 -->
    <div class="template-card" onclick="selectTemplate('report')">
      <div class="template-thumb" style="background:#f8fafc">
        <div class="t-line" style="background:#1a3a5c;width:80%;margin-bottom:2px"></div>
        <div class="t-thin" style="width:55%"></div>
        <div style="height:3px;background:#1a3a5c;opacity:0.3;margin:4px 0"></div>
        <div class="t-line" style="background:#2e7dcc;width:40%;height:2px"></div>
        <div class="t-thin"></div>
        <div class="t-thin" style="width:80%"></div>
        <div class="t-thin" style="width:65%"></div>
        <div class="t-block" style="background:#f0f4f8;border:1px solid #c0cfe0"></div>
        <div class="t-line" style="background:#2e7dcc;width:55%;height:2px"></div>
        <div class="t-thin"></div>
        <div class="t-thin" style="width:80%"></div>
      </div>
      <div class="template-info">
        <div class="template-name">📊 報告書</div>
        <div class="template-desc">業務報告・調査レポート向け。表・本文・まとめ構成</div>
      </div>
    </div>

    <!-- 企画書 -->
    <div class="template-card" onclick="selectTemplate('proposal')">
      <div class="template-thumb" style="background:#f8fafc">
        <div class="t-block" style="background:linear-gradient(135deg,#1a3a5c,#2e7dcc);height:30px;margin-bottom:4px"></div>
        <div class="t-line" style="background:#2e7dcc;width:50%;height:2px"></div>
        <div class="t-thin"></div>
        <div class="t-thin" style="width:80%"></div>
        <div class="t-thin" style="width:65%"></div>
        <div class="t-block" style="background:#f0f4f8;border:1px solid #c0cfe0;height:25px"></div>
        <div class="t-line" style="background:#2e7dcc;width:50%;height:2px"></div>
        <div class="t-thin"></div>
        <div class="t-thin" style="width:80%"></div>
      </div>
      <div class="template-info">
        <div class="template-name">💡 企画書</div>
        <div class="template-desc">新規企画・提案書向け。表紙・課題・スケジュール構成</div>
      </div>
    </div>

    <!-- 白紙 -->
    <div class="template-card" onclick="selectTemplate('blank')">
      <div class="template-thumb" style="background:#fff;border-bottom:1px solid #eee">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#dde4ed;font-size:28px">+</div>
      </div>
      <div class="template-info">
        <div class="template-name">📄 白紙</div>
        <div class="template-desc">白紙からレイアウトを自由に作成</div>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════
     エディタ画面
═══════════════════════════════════ -->
<div id="editorScreen" class="hidden">

  <!-- ツールバー -->
  <div class="toolbar">
    <span class="toolbar-logo">📄 DocEditor</span>
    <div class="toolbar-sep"></div>
    <span class="toolbar-doc-name" id="docTitle">無題のドキュメント</span>
    <div class="toolbar-sep"></div>

    <!-- 要素追加 -->
    <div class="tb-group">
      <button class="tb-btn ghost" onclick="addText()" title="テキスト追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        テキスト
      </button>
      <button class="tb-btn ghost" onclick="addImage()" title="画像追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
        画像
      </button>
      <button class="tb-btn ghost" onclick="addTable()" title="表追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        表
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- Undo/Redo -->
    <div class="tb-group">
      <button class="tb-btn ghost" id="btnUndo" onclick="doUndo()" disabled title="元に戻す (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a4 4 0 0 1 0 8h-1"/></svg>
        Undo
      </button>
      <button class="tb-btn ghost" id="btnRedo" onclick="doRedo()" disabled title="やり直す (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a4 4 0 0 0 0 8h1"/></svg>
        Redo
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- グリッド・保存 -->
    <div class="tb-group">
      <button class="tb-btn ghost" onclick="toggleGrid()" title="グリッド表示切替">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        グリッド
      </button>
      <button class="tb-btn ghost" onclick="saveDoc()" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存
      </button>
    </div>

    <!-- PDF出力 -->
    <button class="tb-btn accent" onclick="exportPdf()" title="PDF出力 (Ctrl+P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12-4-4m4 4 4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>
      PDF 出力
    </button>
  </div>

  <!-- 左：ページナビゲーター -->
  <div class="side-panel">
    <div id="pageNav"></div>
    <button class="add-page-btn" onclick="addNewPage()">+ ページ追加</button>
  </div>

  <!-- 中央：A4キャンバスエリア -->
  <div class="canvas-area" id="canvasArea">
    <div id="scaleBadge" class="scale-badge"></div>
  </div>

  <!-- 右：プロパティパネル -->
  <div class="props-panel">
    <div>
      <div class="props-title">ドキュメント</div>
      <div class="props-row"><span class="props-label">用紙</span><span class="props-val">A4</span></div>
      <div class="props-row"><span class="props-label">幅</span><span class="props-val">210 mm</span></div>
      <div class="props-row"><span class="props-label">高さ</span><span class="props-val">297 mm</span></div>
    </div>
    <div>
      <div class="props-title">選択要素</div>
      <div id="propsContent">
        <p class="props-hint">要素を選択すると<br>プロパティを編集できます</p>
      </div>
    </div>
    <div style="margin-top:auto">
      <button class="export-btn" onclick="exportPdf()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12-4-4m4 4 4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>
        PDF を出力する
      </button>
    </div>
  </div>

</div>

<!-- トースト通知 -->
<div id="toast" class="toast"></div>

<!-- メインスクリプト (ES Modules) -->
<script type="module" src="js/main.js"></script>

<script>
// 白紙テンプレートのフォールバック
const _origSelectTemplate = window.selectTemplate;
window.selectTemplate = async function(type) {
  if (type === 'blank') {
    // 動的に空テンプレートを処理
    const tpl = { id:'blank', name:'白紙', defaultPageCount:1, pages:[{pageNumber:1,label:'ページ1',elements:[]}] };
    // main.js の selectTemplate を直接呼ぶ代わりに fetch をモック
    const origFetch = window.fetch;
    window.fetch = async (url) => {
      if (url.includes('blank.json')) return { json: async () => tpl };
      return origFetch(url);
    };
    await _origSelectTemplate('blank');
    window.fetch = origFetch;
  } else {
    await _origSelectTemplate(type);
  }
};
</script>
</body>
</html>
